<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img" aria-labelledby="t d" font-family="'Plus Jakarta Sans','Inter','Segoe UI',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">A scan, end to end</title>
<desc id="d">The user submits a resume and a job posting in the browser app. The API parses the document, scores it against the posting without a language model, writes explanations and returns the result. Signed-in users also have the result saved to their history.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EA580C"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker>
</defs>
<rect x="0.5" y="0.5" width="979" height="499" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="45" y="24" width="150" height="46" rx="12" fill="#111827" stroke="#111827" stroke-width="1.6"/>
<text x="120.0" y="51.666666666666664" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">User</text>
<line x1="120" y1="70" x2="120" y2="468" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="285" y="24" width="150" height="46" rx="12" fill="#111827" stroke="#111827" stroke-width="1.6"/>
<text x="360.0" y="51.666666666666664" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Browser app</text>
<line x1="360" y1="70" x2="360" y2="468" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="525" y="24" width="150" height="46" rx="12" fill="#111827" stroke="#111827" stroke-width="1.6"/>
<text x="600.0" y="51.666666666666664" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">API</text>
<line x1="600" y1="70" x2="600" y2="468" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="4 6"/>
<rect x="775" y="24" width="150" height="46" rx="12" fill="#111827" stroke="#111827" stroke-width="1.6"/>
<text x="850.0" y="51.666666666666664" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Database</text>
<line x1="850" y1="70" x2="850" y2="468" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="128" y1="112" x2="352" y2="112" stroke="#EA580C" stroke-width="1.8" marker-end="url(#a)"/>
<text x="240.0" y="104" font-size="13" font-weight="400" fill="#111827" text-anchor="middle">Upload resume, paste job posting</text>
<line x1="368" y1="160" x2="592" y2="160" stroke="#EA580C" stroke-width="1.8" marker-end="url(#a)"/>
<text x="480.0" y="152" font-size="13" font-weight="400" fill="#111827" text-anchor="middle">Submit both texts</text>
<rect x="612" y="185" width="215" height="42" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.4"/>
<text x="622" y="202" font-size="12.5" font-weight="500" fill="#111827" text-anchor="start">1. Parse the document</text>
<text x="622" y="217" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">into text and sections</text>
<rect x="612" y="242" width="215" height="42" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.4"/>
<text x="622" y="259" font-size="12.5" font-weight="500" fill="#111827" text-anchor="start">2. Score against the posting</text>
<text x="622" y="274" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">(no language model)</text>
<rect x="612" y="299" width="215" height="42" rx="8" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.4"/>
<text x="622" y="316" font-size="12.5" font-weight="500" fill="#111827" text-anchor="start">3. Write plain-language</text>
<text x="622" y="331" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">explanations for each finding</text>
<line x1="592" y1="388" x2="368" y2="388" stroke="#EA580C" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="480.0" y="380" font-size="13" font-weight="400" fill="#111827" text-anchor="middle">Return the result</text>
<line x1="608" y1="420" x2="842" y2="420" stroke="#EA580C" stroke-width="1.8" marker-end="url(#a)"/>
<text x="725.0" y="412" font-size="13" font-weight="400" fill="#111827" text-anchor="middle">Save to history (signed-in only)</text>
<line x1="352" y1="452" x2="128" y2="452" stroke="#EA580C" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="240.0" y="444" font-size="13" font-weight="400" fill="#111827" text-anchor="middle">Show the result</text>
</svg>
