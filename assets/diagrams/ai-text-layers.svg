<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="t d" font-family="'Plus Jakarta Sans','Inter','Segoe UI',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Five layers around generated text</title>
<desc id="d">Resume and job posting go to a language model that may ask a question or return no change. Code enforces length and format. Deterministic checks compare the output with the resume and highlight problems. The user is told the text was checked automatically and reads it once before sending.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EA580C"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker>
</defs>
<rect x="0.5" y="0.5" width="759" height="639" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="100.0" y="24" width="560" height="70" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/>
<text x="380.0" y="43.666666666666664" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">A strict source boundary</text>
<text x="380.0" y="63.666666666666664" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">Facts about the candidate come only from the resume.</text>
<text x="380.0" y="83.66666666666666" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">Facts about the role come only from the posting.</text>
<circle cx="130.0" cy="59" r="15" fill="#EA580C"/>
<text x="130.0" y="64" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="100.0" y="118" width="560" height="70" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/>
<text x="380.0" y="147.66666666666666" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">The model, with a way to say no</text>
<text x="380.0" y="167.66666666666666" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">It may ask the user a question or report that nothing more should change.</text>
<circle cx="130.0" cy="153" r="15" fill="#EA580C"/>
<text x="130.0" y="158" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="100.0" y="212" width="560" height="70" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/>
<text x="380.0" y="241.66666666666666" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Limits enforced in code</text>
<text x="380.0" y="261.66666666666663" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">Length, paragraphs and format. Bounded retries, best draft kept.</text>
<circle cx="130.0" cy="247" r="15" fill="#EA580C"/>
<text x="130.0" y="252" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="542.0" y="202" width="108" height="20" rx="10" fill="#111827"/>
<text x="596.0" y="216" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Code, not AI</text>
<rect x="100.0" y="306" width="560" height="70" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/>
<text x="380.0" y="335.6666666666667" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Deterministic checks against the resume</text>
<text x="380.0" y="355.6666666666667" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">Numbers, tools, lifted sentences, inflated wording. Highlight, never delete.</text>
<circle cx="130.0" cy="341" r="15" fill="#EA580C"/>
<text x="130.0" y="346" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="542.0" y="296" width="108" height="20" rx="10" fill="#111827"/>
<text x="596.0" y="310" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Code, not AI</text>
<rect x="100.0" y="400" width="560" height="70" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/>
<text x="380.0" y="429.6666666666667" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Honest wording to the user</text>
<text x="380.0" y="449.6666666666667" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">Says the text was checked automatically and asks for one read before sending.</text>
<circle cx="130.0" cy="435" r="15" fill="#EA580C"/>
<text x="130.0" y="440" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="100.0" y="494" width="560" height="70" rx="12" fill="#111827" stroke="#111827" stroke-width="1.6"/>
<text x="380.0" y="523.6666666666666" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">The user decides</text>
<text x="380.0" y="543.6666666666666" font-size="12" font-weight="400" fill="#E5E7EB" text-anchor="middle">Edits, keeps or discards the text</text>
<line x1="380" y1="94" x2="380" y2="118" stroke="#EA580C" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="380" y1="188" x2="380" y2="212" stroke="#EA580C" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="380" y1="282" x2="380" y2="306" stroke="#EA580C" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="380" y1="376" x2="380" y2="400" stroke="#EA580C" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="380" y1="470" x2="380" y2="494" stroke="#EA580C" stroke-width="1.8" marker-end="url(#a)"/>
</svg>
