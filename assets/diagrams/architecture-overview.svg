<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" aria-labelledby="t d" font-family="'Plus Jakarta Sans','Inter','Segoe UI',Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">System overview</title>
<desc id="d">A user reaches a browser app. The browser app calls an API and signs in directly with the authentication service. The API reads and writes the database and calls a language model provider and an email provider.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EA580C"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker>
</defs>
<rect x="0.5" y="0.5" width="979" height="399" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="30" y="165" width="110" height="70" rx="12" fill="#111827" stroke="#111827" stroke-width="1.6"/>
<text x="85.0" y="204.66666666666666" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">User</text>
<rect x="195" y="120" width="220" height="160" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/>
<text x="305.0" y="184.66666666666666" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Browser app</text>
<text x="305.0" y="204.66666666666666" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">React and Vite, on Netlify</text>
<text x="305.0" y="224.66666666666666" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">Holds public keys only</text>
<rect x="490" y="120" width="220" height="160" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/>
<text x="600.0" y="174.66666666666666" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">API</text>
<text x="600.0" y="194.66666666666666" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">FastAPI, on Railway</text>
<text x="600.0" y="214.66666666666666" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">Holds every secret</text>
<text x="600.0" y="234.66666666666666" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">Scoring, text features, email</text>
<rect x="760" y="36" width="200" height="104" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.6"/>
<text x="860.0" y="62.666666666666664" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Database and sign-in</text>
<text x="860.0" y="82.66666666666666" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">Managed PostgreSQL</text>
<text x="860.0" y="102.66666666666666" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">EU region</text>
<text x="860.0" y="122.66666666666666" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">Row-level access control</text>
<rect x="760" y="160" width="200" height="80" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.6"/>
<text x="860.0" y="194.66666666666666" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Language model provider</text>
<text x="860.0" y="214.66666666666666" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">Two text features only</text>
<rect x="760" y="262" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.6"/>
<text x="860.0" y="301.6666666666667" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Email provider</text>
<line x1="140" y1="200" x2="193" y2="200" stroke="#EA580C" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="415" y1="200" x2="488" y2="200" stroke="#EA580C" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="710" y1="170" x2="758" y2="100" stroke="#EA580C" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="710" y1="200" x2="758" y2="200" stroke="#EA580C" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="710" y1="235" x2="758" y2="290" stroke="#EA580C" stroke-width="1.8" marker-end="url(#a)"/>
<path d="M305 120 V68 H758" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#g)"/>
<text x="540" y="60" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">Sign-in goes straight from the browser</text>
<text x="490" y="368" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">Solid arrows are requests. The browser never holds a secret, and the API does not take the browser's word for anything it must verify.</text>
</svg>
