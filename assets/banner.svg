<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="ClearScan Engineering. Field notes from building and running a production ATS resume scanner.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F24"/>
      <stop offset="0.55" stop-color="#14123A"/>
      <stop offset="1" stop-color="#231A5C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B7BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D8C0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#34D8C0" stop-opacity="1"/>
      <stop offset="1" stop-color="#34D8C0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9C2FF"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8B7BFF" fill-opacity="0.16"/>
    </pattern>
    <clipPath id="page"><rect x="0" y="0" width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#page)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <circle cx="1010" cy="120" r="260" fill="url(#glow)"/>

    <g transform="translate(92 54)">
      <rect x="0" y="0" width="148" height="188" rx="16" fill="#1B1850" stroke="#8B7BFF" stroke-opacity="0.75" stroke-width="2"/>
      <path d="M104 0 L148 44 L148 16 A16 16 0 0 0 132 0 Z" fill="#8B7BFF" fill-opacity="0.35"/>
      <rect x="24" y="34" width="52" height="8" rx="4" fill="#C9C2FF"/>
      <rect x="24" y="62" width="100" height="6" rx="3" fill="#8B7BFF" fill-opacity="0.55"/>
      <rect x="24" y="82" width="86" height="6" rx="3" fill="#8B7BFF" fill-opacity="0.55"/>
      <rect x="24" y="102" width="98" height="6" rx="3" fill="#8B7BFF" fill-opacity="0.55"/>
      <rect x="24" y="122" width="70" height="6" rx="3" fill="#8B7BFF" fill-opacity="0.55"/>
      <rect x="24" y="142" width="92" height="6" rx="3" fill="#8B7BFF" fill-opacity="0.55"/>
      <rect x="-22" y="92" width="192" height="3" rx="1.5" fill="url(#beam)"/>
      <rect x="-22" y="84" width="192" height="19" fill="#34D8C0" fill-opacity="0.07"/>
    </g>

    <text x="300" y="128" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-1" fill="url(#title)">ClearScan Engineering</text>
    <text x="302" y="176" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#AEB6D6">Field notes from building and running a production ATS resume scanner</text>

    <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
      <rect x="302" y="208" width="132" height="34" rx="17" fill="#8B7BFF" fill-opacity="0.16" stroke="#8B7BFF" stroke-opacity="0.55"/>
      <text x="368" y="230" text-anchor="middle" fill="#D9D4FF">Architecture</text>
      <rect x="446" y="208" width="132" height="34" rx="17" fill="#8B7BFF" fill-opacity="0.16" stroke="#8B7BFF" stroke-opacity="0.55"/>
      <text x="512" y="230" text-anchor="middle" fill="#D9D4FF">Trade-offs</text>
      <rect x="590" y="208" width="168" height="34" rx="17" fill="#34D8C0" fill-opacity="0.14" stroke="#34D8C0" stroke-opacity="0.6"/>
      <text x="674" y="230" text-anchor="middle" fill="#B8F5EA">Real incidents</text>
    </g>
  </g>
</svg>
