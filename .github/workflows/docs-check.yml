name: Docs check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation
        run: python3 scripts/check_docs.py
      - name: Build the site
        run: |
          python3 -m pip install markdown==3.10.3
          python3 scripts/build_site.py
